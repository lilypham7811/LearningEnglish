# Copy of .github/workflows/ai-voice.yml in the private sync repo (shadow-english-sync), kept here with the app.
# Runs when the app updates voice.json: fetches the text of articles saved by link only (make_articles.py),
# looks up Cambridge/Oxford examples for new words (make_examples.py),
# then makes the missing AI-voice audio (make_voice.py), and commits both.
# Free: GitHub gives private repos 2,000 minutes a month; a few new words take about 2 minutes.
name: AI voice
on:
  push:
    branches: [main]
    paths: [voice.json]
  workflow_dispatch:
concurrency:
  group: ai-voice
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  voice:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/kokoro
          key: kokoro-onnx-model-v1.0
      - name: Voice model (downloaded once, then cached)
        run: |
          mkdir -p ~/kokoro && cd ~/kokoro
          B=https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0
          [ -s kokoro-v1.0.onnx ] || curl -sSfLo kokoro-v1.0.onnx "$B/kokoro-v1.0.onnx"
          [ -s voices-v1.0.bin ] || curl -sSfLo voices-v1.0.bin "$B/voices-v1.0.bin"
      - run: pip install -q kokoro-onnx==0.4.7 lameenc==1.9.0 beautifulsoup4==4.15.0 trafilatura==2.3.1
      # Pronunciation (misaki, see make_voice.py). Not "misaki[en]": that also pulls in torch (gigabytes), unused here.
      - run: >-
          pip install -q misaki==0.9.4 num2words==0.5.14 spacy==3.8.18 phonemizer-fork==3.3.1 espeakng-loader==0.2.4
          https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
      - name: Article text, dictionary examples, then audio
        run: |
          git config user.name "AI voice"
          git config user.email "ai-voice@users.noreply.github.com"
          python .github/voice/make_articles.py
          python .github/voice/make_examples.py
          python .github/voice/make_voice.py ~/kokoro
